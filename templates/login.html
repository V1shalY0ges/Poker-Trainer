<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Trainer • Login</title>
<style>
body { margin:0; font-family:"Segoe UI"; background: radial-gradient(circle,#006400 0%,#003300 100%); color:#fff; display:flex; justify-content:center; align-items:center; height:100vh;}
.card { background:rgba(0,0,0,0.7); padding:35px; border-radius:12px; width:100%; max-width:420px; text-align:center; border:1px solid #b8860b; box-shadow:0px 0px 25px rgba(0,0,0,0.4);}
h1 { color:gold; margin-bottom:10px; font-size:32px;}
input, button { width:90%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #b8860b; background:rgba(255,255,255,0.1); color:white; font-size:16px; outline:none;}
button { background:gold; color:black; cursor:pointer; transition:0.2s;}
button:hover { background:#ffdb4d;}
.switch-link a { color:gold; text-decoration:none;}
.switch-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="card">
<h1>Login</h1>
<form id="loginForm">
    <input type="text" id="identifier" name="identifier" placeholder="Username or Email" required>
    <input type="password" id="password" name="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
</form>
<p class="switch-link"><a href="/forgot_password">Forgot Password?</a></p>

<p class="switch-link">New here? <a href="/register">Create an account</a></p>

</div>

<script>
document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();

    const identifier = document.getElementById("identifier").value.trim();
    const password = document.getElementById("password").value;

    if (!identifier || !password) return alert("Please fill all fields.");

    const formData = new FormData();
    formData.append("identifier", identifier);
    formData.append("password", password);

    try {
        const res = await fetch("/auth/login", {
            method: "POST",
            body: formData
        });

        if (!res.ok) {
            const err = await res.json();
            return alert(err.detail || "Login failed");
        }

        const data = await res.json();

        // Store JWT & username in sessionStorage (per tab)
        sessionStorage.setItem("token", data.access_token);
        sessionStorage.setItem("username", identifier);

        // Redirect to home
        window.location.href = "/dummy_home";
    } catch (err) {
        console.error(err);
        alert("Login error");
    }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Trainer • Reset Password</title>
<style>
body {
    margin: 0;
    font-family: "Segoe UI";
    background: radial-gradient(circle,#006400 0%,#003300 100%);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.card {
    background: rgba(0,0,0,0.7);
    padding: 35px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    border: 1px solid #b8860b;
    box-shadow: 0px 0px 25px rgba(0,0,0,0.4);
}
h1 { color: gold; margin-bottom: 10px; font-size: 32px; }
input, button {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #b8860b;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 16px;
    outline: none;
}
button {
    background: gold;
    color: black;
    cursor: pointer;
    transition: 0.2s;
}
button:hover { background: #ffdb4d; }
.switch-link a { color: gold; text-decoration: none; }
.switch-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
<h1>Reset Password</h1>
<form id="resetForm">
    <input type="password" id="new_password" name="new_password" placeholder="New Password" required>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
    <button type="submit">Set New Password</button>
</form>
<p class="switch-link"><a href="/login">Back to Login</a></p>
<p id="message" style="color:lightgreen;"></p>
</div>

<script>
const BACKEND_URL = "http://127.0.0.1:3000"; // FastAPI backend
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
    document.getElementById("message").textContent = "Invalid or missing token.";
}

document.getElementById("resetForm").onsubmit = async (e) => {
    e.preventDefault();

    const new_password = document.getElementById("new_password").value;
    const confirm_password = document.getElementById("confirm_password").value;

    if (!new_password || !confirm_password) return alert("Fill all fields");
    if (new_password !== confirm_password) return alert("Passwords do not match");

    const formData = new FormData();
    formData.append("token", token);
    formData.append("new_password", new_password);

    try {
        const res = await fetch(`${BACKEND_URL}/auth/reset-password-token`, {
            method: "POST",
            body: formData
        });
        const data = await res.json();

        if (res.ok) {
            document.getElementById("message").textContent = data.message;
            setTimeout(() => { window.location.href = "/login"; }, 2000);
        } else {
            document.getElementById("message").textContent = data.detail || "Failed to reset password.";
        }

    } catch (err) {
        console.error(err);
        alert("Error resetting password.");
    }
};
</script>
</body>
</html>

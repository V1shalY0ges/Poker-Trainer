<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Trainer • Register</title>
<style>
body { margin:0; font-family:"Segoe UI"; background: radial-gradient(circle,#006400 0%,#003300 100%); color:#fff; display:flex; justify-content:center; align-items:center; height:100vh;}
.card { background:rgba(0,0,0,0.7); padding:35px; border-radius:12px; width:100%; max-width:420px; text-align:center; border:1px solid #b8860b; box-shadow:0px 0px 25px rgba(0,0,0,0.4);}
h1 { color:gold; margin-bottom:10px; font-size:32px;}
input, button { width:90%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #b8860b; background:rgba(255,255,255,0.1); color:white; font-size:16px; outline:none;}
button { background:gold; color:black; cursor:pointer; transition:0.2s;}
button:hover { background:#ffdb4d;}
.switch-link a { color:gold; text-decoration:none;}
.switch-link a:hover{text-decoration:underline;}
.password-wrapper {
    position: relative;
    width: 93%;
    padding:8px;
}

.password-wrapper input {
    width: 90%;
    padding-right: 40px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    user-select: none;
}

</style>
</head>
<body>
<div class="card">
<h1>Register</h1>
<form id="registerForm">
    <input type="text" id="username" name="username" placeholder="Username" required>
    <input type="email" id="email" name="email" placeholder="Email" required>
<div class="password-wrapper">
    <input type="password" id="password" name="password" placeholder="Password" required>
    <span class="toggle-password" onclick="togglePassword()">👁</span>
</div>
    <button type="submit">Create Account</button>
</form>
<p class="switch-link">Already have an account? <a href="/login">Login</a></p>
</div>

<script>
document.getElementById("registerForm").onsubmit = async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !email || !password) return alert("Please fill all fields.");

    const formData = new FormData();
    formData.append("username", username);
    formData.append("email", email);
    formData.append("password", password);

    try {
        const res = await fetch("/auth/register", { method: "POST", body: formData });
        if (!res.ok) {
            const err = await res.json();
            return alert(err.detail || "Registration failed");
        }

        // Automatically log in after registration
        const loginRes = await fetch("/auth/login", {
            method: "POST",
            body: new URLSearchParams({ identifier: username, password })
        });
        const loginData = await loginRes.json();

        //  Store JWT & username in sessionStorage
        sessionStorage.setItem("token", loginData.access_token);
        sessionStorage.setItem("username", username);

        window.location.href = "/dummy_home";

    } catch (err) {
        console.error(err);
        alert("Registration error");
    }
};
function togglePassword() {
    const passwordInput = document.getElementById("password");
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }
}

</script>
</body>
</html>

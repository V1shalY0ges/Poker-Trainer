<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Trainer • Forgot Password</title>
<style>
body { margin:0; font-family:"Segoe UI"; background: radial-gradient(circle,#006400 0%,#003300 100%); color:#fff; display:flex; justify-content:center; align-items:center; height:100vh;}
.card { background:rgba(0,0,0,0.7); padding:35px; border-radius:12px; width:100%; max-width:420px; text-align:center; border:1px solid #b8860b; box-shadow:0px 0px 25px rgba(0,0,0,0.4);}
h1 { color:gold; margin-bottom:10px; font-size:32px;}
input, button { width:90%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #b8860b; background:rgba(255,255,255,0.1); color:white; font-size:16px; outline:none;}
button { background:gold; color:black; cursor:pointer; transition:0.2s;}
button:hover { background:#ffdb4d;}
.switch-link a { color:gold; text-decoration:none;}
.switch-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="card">
<h1>Forgot Password</h1>
<form id="forgotForm">
    <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
    <button type="submit">Send Reset Link</button>
</form>
<p class="switch-link"><a href="/login">Back to Login</a></p>
<p id="message" style="color:lightgreen;"></p>
</div>

<script>
document.getElementById("forgotForm").onsubmit = async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    if (!email) return alert("Please enter your email.");

    const formData = new FormData();
    formData.append("email", email);

    try {
        const res = await fetch("/auth/forgot-password", {
            method: "POST",
            body: formData
        });
        const data = await res.json();
        document.getElementById("message").textContent = data.message;
    } catch (err) {
        console.error(err);
        alert("Error sending reset link.");
    }
};
</script>
</body>
</html>
